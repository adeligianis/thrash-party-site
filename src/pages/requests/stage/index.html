<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Thrash Party Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Stage view: a phone on a mic stand, read from about a metre away.
   Sticky totals bar, open requests sorted by tip, collapsed Done list. */
:root{
  --bg:#000; --fg:#fff; --muted:#a3a8b3; --line:#2a2e36; --panel:#0b0c10;
  --cyan:#01ffff; --magenta:#ff00ff;
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:20px;line-height:1.3;-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.label{font-family:var(--label);font-weight:600;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.msg{padding:40px 0;text-align:center;color:var(--muted);font-size:22px}
.err{color:var(--magenta)}

/* PIN screen */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:24px}
.login h1{font-family:var(--display);font-weight:400;font-size:56px;line-height:.95;margin:0}
.login h1 span{color:var(--cyan)}
.pin{width:100%;font-family:var(--display);font-size:56px;letter-spacing:.3em;text-align:center;color:var(--fg);background:var(--panel);border:2px solid var(--line);padding:12px;border-radius:0;outline:none}
.pin:focus{border-color:var(--cyan)}
.big-btn{display:block;width:100%;font-family:var(--display);font-size:34px;letter-spacing:.04em;border:0;padding:14px;background:var(--cyan);color:var(--bg)}
.big-btn.pink{background:var(--magenta)}
.big-btn.ghost{background:none;color:var(--fg);border:2px solid var(--line)}
.big-btn[disabled]{opacity:.5;cursor:default}

/* Totals bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line);padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:10px}
.stats{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.total{font-family:var(--display);font-size:64px;line-height:.9;color:var(--cyan)}
.count{font-family:var(--display);font-size:40px;line-height:.9;text-align:right}
.count small{display:block;font-family:var(--label);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.state{margin:6px 0 10px}
.state.live{color:var(--magenta)}
.controls{display:grid;grid-template-columns:1fr auto;gap:8px}
.sort{font-family:var(--label);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;background:none;border:2px solid var(--line);padding:0 14px;min-height:56px}

/* Request rows */
ul.reqs{list-style:none;margin:0;padding:0}
.req{border-bottom:1px solid var(--line)}
.row{display:block;width:100%;text-align:left;background:none;border:0;padding:16px 0}
.song{display:block;font-family:var(--display);font-weight:400;font-size:42px;line-height:1;overflow-wrap:anywhere}
.shout{display:block;margin-top:6px;font-size:24px;line-height:1.25;font-style:italic;color:#e6e8ec;overflow-wrap:anywhere;white-space:pre-wrap}
.meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-top:8px}
.amt{font-family:var(--display);font-size:36px;line-height:1;color:var(--cyan)}
.time{font-family:var(--label);font-weight:600;font-size:22px;letter-spacing:.04em;color:var(--muted)}
.badge{font-family:var(--label);font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--magenta);border:2px solid var(--magenta);padding:0 8px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:16px}
.acts button{font-family:var(--display);font-size:30px;letter-spacing:.04em;border:0;padding:14px 8px;min-height:64px}
.acts .played{background:var(--cyan);color:var(--bg)}
.acts .skipped{background:none;border:2px solid var(--muted);color:var(--fg)}

/* Done list */
.done{margin:28px 0 48px;border-top:2px solid var(--line)}
.done summary{list-style:none;cursor:pointer;padding:16px 0;font-family:var(--display);font-size:32px;color:var(--muted)}
.done summary::-webkit-details-marker{display:none}
.done summary::before{content:"+ ";color:var(--cyan)}
.done[open] summary::before{content:"\2212  "}
.done .req{opacity:.45;display:flex;align-items:center;gap:12px}
.done .req .row{flex:1;min-width:0;cursor:default}
.done .song{font-size:30px}
.done .shout{font-size:20px}
.done .amt{color:var(--fg)}
.undo{flex:none;font-family:var(--label);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;background:none;border:2px solid var(--fg);padding:10px 14px;min-height:52px}
.done .req:focus-within{opacity:1}
.toast{position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20;background:var(--magenta);color:var(--bg);font-weight:600;padding:14px 16px;text-align:center}
</style>
</head>
<body>

<p class="msg wrap" id="loading">Loading…</p>

<form class="login wrap" id="login" hidden>
  <h1>Thrash Party <span>Stage</span></h1>
  <label class="label" for="pin">Band PIN</label>
  <input class="pin" id="pin" type="password" inputmode="numeric" autocomplete="off" required>
  <button class="big-btn" id="pinBtn" type="submit">Sign in</button>
  <p class="label err" id="pinErr" role="alert" hidden></p>
</form>

<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <div class="stats">
        <div><div class="label">Show total</div><div class="total" id="total">$0</div></div>
        <div class="count" id="count">0<small>requests</small></div>
      </div>
      <p class="label state" id="state"></p>
      <div class="controls">
        <button class="big-btn" id="showBtn" type="button">Start show</button>
        <button class="sort" id="sortBtn" type="button"></button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <ul class="reqs" id="list" aria-live="polite"></ul>
    <p class="msg" id="empty" hidden></p>
    <details class="done" id="done" hidden>
      <summary id="doneSum">Done</summary>
      <ul class="reqs" id="doneList"></ul>
    </details>
  </main>
</div>

<p class="toast" id="toast" role="alert" hidden></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithCustomToken, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getFirestore, doc, collection, query, where, onSnapshot, writeBatch, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyB9fxgNIjZJ81TQZlkzH5yR6_VA9pkDUM8",
  authDomain: "thrash-party-app.firebaseapp.com",
  projectId: "thrash-party-app",
  storageBucket: "thrash-party-app.firebasestorage.app",
  messagingSenderId: "999278198578",
  appId: "1:999278198578:web:7f0bcd046027931820a12b",
});
// getAuth keeps the session in IndexedDB, so the device stays signed in.
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (s) => document.querySelector(s);
const SORT_KEY = "stage-sort";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let sortBy = store.get(SORT_KEY) === "time" ? "time" : "amount";
let show = null;          // { id, startedAt: Date, endedAt: Date|null }
let requests = [];        // non-refunded requests for the current show
let openId = null;        // row showing Played / Skipped
let stopMeta = null, stopShow = null, stopReqs = null;

const money = (cents) => "$" + (cents / 100).toFixed(cents % 100 ? 2 : 0);
const clock = (d) => d ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
const ms = (d) => (d ? d.getTime() : 0);

function toast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 4000);
}

// ---------- sign in ----------
function showScreen(name) {
  $("#loading").hidden = name !== "loading";
  $("#login").hidden = name !== "login";
  $("#app").hidden = name !== "app";
}

$("#login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("#pinBtn"), err = $("#pinErr");
  btn.disabled = true;
  err.hidden = true;
  try {
    const res = await fetch("/.netlify/functions/band-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin: $("#pin").value }),
    });
    if (res.status === 401) throw new Error("Wrong PIN. Try again.");
    if (!res.ok) throw new Error("Sign-in isn't working right now.");
    const { token } = await res.json();
    await signInWithCustomToken(auth, token);
    $("#pin").value = "";
  } catch (ex) {
    err.textContent = ex.message.startsWith("Wrong") || ex.message.startsWith("Sign-in") ? ex.message : "Couldn't reach the server. Check the connection.";
    err.hidden = false;
    $("#pin").select();
  } finally {
    btn.disabled = false;
  }
});

onAuthStateChanged(auth, async (user) => {
  stopAll();
  if (!user) return showScreen("login");
  let claims = {};
  try { ({ claims } = await user.getIdTokenResult()); } catch {}
  if (claims.band !== true) {
    await signOut(auth);
    return;
  }
  showScreen("app");
  watchCurrentShow();
});

// ---------- live data ----------
function stopAll() {
  [stopMeta, stopShow, stopReqs].forEach((stop) => stop && stop());
  stopMeta = stopShow = stopReqs = null;
  show = null;
  requests = [];
}

const listenError = (err) => {
  console.error(err);
  toast(err.code === "permission-denied" ? "No access. Sign in again." : "Lost the live connection. Retrying…");
  if (err.code === "permission-denied") signOut(auth);
};

function watchCurrentShow() {
  stopMeta = onSnapshot(doc(db, "meta", "current"), (snap) => {
    const id = snap.exists() ? snap.data().showId : null;
    if (show && show.id === id) return;
    if (stopShow) stopShow();
    if (stopReqs) stopReqs();
    stopShow = stopReqs = null;
    show = null;
    requests = [];
    if (!id) return render();
    stopShow = onSnapshot(doc(db, "shows", id), (s) => {
      if (!s.exists()) return;
      // "estimate" fills in a just-written serverTimestamp with local time
      // until the server confirms it.
      const d = s.data({ serverTimestamps: "estimate" });
      const next = { id, startedAt: d.startedAt?.toDate() ?? null, endedAt: d.endedAt?.toDate() ?? null };
      const changed = !show || ms(show.startedAt) !== ms(next.startedAt) || ms(show.endedAt) !== ms(next.endedAt);
      show = next;
      if (changed) watchRequests();
      render();
    }, listenError);
  }, listenError);
}

function watchRequests() {
  if (stopReqs) stopReqs();
  stopReqs = null;
  if (!show || !show.startedAt) return;
  const filters = [where("createdAt", ">=", show.startedAt)];
  if (show.endedAt) filters.push(where("createdAt", "<=", show.endedAt));
  stopReqs = onSnapshot(query(collection(db, "requests"), ...filters), (snap) => {
    requests = snap.docs
      .map((d) => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) }))
      .filter((r) => !r.refunded)
      .map((r) => ({ ...r, createdAt: r.createdAt?.toDate() ?? null, statusAt: r.statusAt?.toDate() ?? null }));
    render();
  }, listenError);
}

// ---------- actions ----------
$("#showBtn").addEventListener("click", async () => {
  const btn = $("#showBtn");
  btn.disabled = true;
  try {
    if (show && !show.endedAt) {
      if (!confirm("End the show? The list stays up until you start the next one.")) return;
      await updateDoc(doc(db, "shows", show.id), { endedAt: serverTimestamp() });
    } else {
      const ref = doc(collection(db, "shows"));
      const batch = writeBatch(db);
      batch.set(ref, { startedAt: serverTimestamp(), endedAt: null });
      batch.set(doc(db, "meta", "current"), { showId: ref.id });
      await batch.commit();
    }
  } catch (err) {
    console.error(err);
    toast("Couldn't save that. Check the connection and try again.");
  } finally {
    btn.disabled = false;
  }
});

$("#sortBtn").addEventListener("click", () => {
  sortBy = sortBy === "amount" ? "time" : "amount";
  store.set(SORT_KEY, sortBy);
  render();
});

async function setStatus(id, status) {
  openId = null;
  try {
    await updateDoc(doc(db, "requests", id), { status, statusAt: serverTimestamp() });
  } catch (err) {
    console.error(err);
    toast("Couldn't update that request. Try again.");
  }
}

// ---------- render ----------
// Built with createElement and textContent only, so nothing a fan types is
// ever parsed as HTML.
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function songLabel(r) {
  if (r.song) return r.song;
  return r.kind === "freebird" ? "Free Bird solo" : "No song given";
}

function body(r) {
  const frag = document.createDocumentFragment();
  frag.append(el("span", "song", songLabel(r)));
  if (r.shoutout) frag.append(el("span", "shout", `“${r.shoutout}”`));
  const meta = el("span", "meta");
  meta.append(el("span", "amt", money(r.amountCents || 0)), el("span", "time", clock(r.createdAt)));
  if (r.kind === "freebird") meta.append(el("span", "badge", "Free Bird"));
  frag.append(meta);
  return frag;
}

function openRow(r) {
  const li = el("li", "req");
  const row = el("button", "row");
  row.type = "button";
  row.setAttribute("aria-expanded", String(openId === r.id));
  row.append(body(r));
  row.addEventListener("click", () => { openId = openId === r.id ? null : r.id; render(); });
  li.append(row);
  if (openId === r.id) {
    const acts = el("div", "acts");
    const played = el("button", "played", "Played");
    const skipped = el("button", "skipped", "Skipped");
    played.type = skipped.type = "button";
    played.addEventListener("click", () => setStatus(r.id, "played"));
    skipped.addEventListener("click", () => setStatus(r.id, "skipped"));
    acts.append(played, skipped);
    li.append(acts);
  }
  return li;
}

function doneRow(r) {
  const li = el("li", "req");
  const info = el("div", "row");
  info.append(body(r));
  const undo = el("button", "undo", "Undo");
  undo.type = "button";
  undo.setAttribute("aria-label", `Undo ${r.status}: ${songLabel(r)}`);
  undo.addEventListener("click", () => setStatus(r.id, "new"));
  li.append(info, undo);
  return li;
}

const byAmount = (a, b) => (b.amountCents || 0) - (a.amountCents || 0) || ms(a.createdAt) - ms(b.createdAt);
const byTime = (a, b) => ms(a.createdAt) - ms(b.createdAt);

function render() {
  const running = show && !show.endedAt;
  const total = requests.reduce((sum, r) => sum + (r.amountCents || 0), 0);
  const listed = requests.filter((r) => r.kind === "request" || r.kind === "freebird");
  const isDone = (r) => r.status === "played" || r.status === "skipped";
  const open = listed.filter((r) => !isDone(r)).sort(sortBy === "amount" ? byAmount : byTime);
  const done = listed.filter(isDone).sort((a, b) => ms(b.statusAt) - ms(a.statusAt));

  $("#total").textContent = money(total);
  $("#count").firstChild.textContent = String(listed.length);
  $("#count").lastChild.textContent = listed.length === 1 ? "request" : "requests";

  const state = $("#state");
  state.classList.toggle("live", !!running);
  state.textContent = !show ? "No show yet"
    : running ? `Live since ${clock(show.startedAt)}`
    : `Ended ${clock(show.endedAt)} · started ${clock(show.startedAt)}`;

  const btn = $("#showBtn");
  btn.textContent = running ? "End show" : "Start show";
  btn.classList.toggle("pink", !!running);
  $("#sortBtn").textContent = sortBy === "amount" ? "Sort: $ high" : "Sort: Oldest";
  $("#sortBtn").setAttribute("aria-label", sortBy === "amount" ? "Sorted by amount. Switch to time order" : "Sorted by time. Switch to amount order");

  $("#list").replaceChildren(...open.map(openRow));

  const empty = $("#empty");
  empty.hidden = open.length > 0;
  empty.textContent = !show ? "Tap Start show when you go on."
    : listed.length ? "All caught up."
    : running ? "No requests yet. They’ll appear here live." : "No requests this show.";

  $("#done").hidden = done.length === 0;
  $("#doneSum").textContent = `Done (${done.length})`;
  $("#doneList").replaceChildren(...done.map(doneRow));
}

// Keep the screen awake on the mic stand while signed in, where supported.
let wakeLock = null;
async function keepAwake() {
  if (!("wakeLock" in navigator) || document.visibilityState !== "visible" || $("#app").hidden) return;
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", keepAwake);
new MutationObserver(keepAwake).observe($("#app"), { attributes: true, attributeFilter: ["hidden"] });

showScreen("loading");
</script>
</body>
</html>
